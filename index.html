<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('101-punkte-v1');
        var theme = raw && JSON.parse(raw).theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Punktezettel für 101 (Okey): zwei Teams, elf Runden, Spracheingabe auf Deutsch.">
  <meta id="theme-color" name="theme-color" content="#d5e3db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="101 Punkte">
  <title>101 Punkte</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/carlito-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/carlito-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="scoreboard">
    <div class="topbar">
      <div class="brand">
        <span class="tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div>
          <p class="eyebrow">Okey</p>
          <h1>101 Punkte</h1>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="theme" class="icon-btn" aria-label="Dunkles Design">
          <svg id="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
          <svg id="icon-sun" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5h0v3h0V2zm0 17h0v3h0v-3zM4.2 5.6l1.8 1.8-1.4 1.4L2.8 7 4.2 5.6zM19.4 18.2l1.4 1.4-1.4 1.4-1.4-1.4 1.4-1.4zM2 11h3v2H2v-2zm17 0h3v2h-3v-2zM4.2 18.4 5.6 17l1.4 1.4-1.4 1.4-1.4-1.4zM17 5.6l1.4-1.4L19.8 5.6 18.4 7 17 5.6z"/></svg>
        </button>
        <button type="button" id="speak" class="icon-btn" aria-label="Stand vorlesen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
        </button>
      </div>
    </div>
    <div class="teams">
      <article class="team-card a" data-team-card="0">
        <input id="name-a" class="name" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Name von Team A" value="Team A">
        <p class="kicker">Summe</p>
        <p class="total" id="total-a">0</p>
      </article>
      <article class="team-card b" data-team-card="1">
        <input id="name-b" class="name" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Name von Team B" value="Team B">
        <p class="kicker">Summe</p>
        <p class="total" id="total-b">0</p>
      </article>
    </div>
    <div id="result">
      <p id="lead" class="lead">Niedrigste Summe gewinnt</p>
      <div id="winner" class="winner" hidden></div>
    </div>
  </header>

  <main class="paper">
    <div id="sheet" class="sheet" aria-label="Punktezettel"></div>
  </main>

  <footer class="dock">
    <div class="dock-inner">
      <div class="status-row">
        <p id="status" class="status" aria-live="polite">Runde 1 · Team A</p>
        <span id="progress" class="progress">0/11</span>
      </div>
      <p id="hint" class="hint"></p>
      <button type="button" id="mic" class="mic" aria-pressed="false" aria-label="Mikrofon einschalten">
        <svg id="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V20H9v2h6v-2h-2v-2.08A7 7 0 0 0 19 11h-2z"/></svg>
        <svg id="mic-stop" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
        <svg id="mic-keys" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm1 3v2h2V8H5zm4 0v2h2V8H9zm4 0v2h2V8h-2zm4 0v2h2V8h-2zM5 12v2h2v-2H5zm4 0v2h2v-2H9zm4 0v2h6v-2h-6z"/></svg>
      </button>
      <p id="mic-caption" class="mic-caption">Sagen</p>
      <div class="dock-actions">
        <button type="button" id="keypad-open" class="btn ghost">Tastatur</button>
        <button type="button" id="new-game" class="btn ghost">Neues Spiel</button>
      </div>
    </div>
  </footer>

  <div id="backdrop" class="backdrop" hidden></div>

  <div id="keypad" class="keypad" role="dialog" aria-modal="true" aria-label="Punkte eingeben" hidden>
    <div class="keypad-top">
      <p id="keypad-where" class="where"></p>
      <p id="keypad-value" aria-live="polite">–</p>
      <button type="button" class="text-x" data-key="close" aria-label="Schließen">Schließen</button>
    </div>
    <div class="keys">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="sign" aria-label="Vorzeichen wechseln">±</button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="back" aria-label="Letzte Ziffer löschen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22 4H8L1 12l7 8h14V4zm-3.5 11.1-1.4 1.4L14 13.4l-3.1 3.1-1.4-1.4 3.1-3.1-3.1-3.1 1.4-1.4 3.1 3.1 3.1-3.1 1.4 1.4-3.1 3.1 3.1 3.1z"/></svg>
      </button>
      <button type="button" data-key="clear" class="minor">Leeren</button>
      <button type="button" data-key="ok" class="ok" aria-label="Übernehmen">OK</button>
    </div>
  </div>

  <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
    <h2 id="dialog-title">Neues Spiel?</h2>
    <p>Alle Punkte werden gelöscht. Die Teamnamen bleiben erhalten.</p>
    <div class="dialog-actions">
      <button type="button" id="cancel-reset" class="btn ghost">Abbrechen</button>
      <button type="button" id="confirm-reset" class="btn danger">Löschen</button>
    </div>
  </div>

  <noscript>
    <p class="noscript">101 Punkte braucht JavaScript.</p>
  </noscript>

  <script src="score.js"></script>
  <script src="numbers.js"></script>
  <script src="app.js"></script>
</body>
</html>
